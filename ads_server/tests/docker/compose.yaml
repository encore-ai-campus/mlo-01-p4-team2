# 시험·로컬 개발용 DB 컨테이너(계획 docs/plans/00 P1-1). 접속 값은 ads_server/.env 의 DB_*·MONGO_* 를 쓴다.
#
#   cd ads_server
#   docker compose --env-file .env -f tests/docker/compose.yaml up -d                    PostgreSQL + MongoDB
#   docker compose --env-file .env -f tests/docker/compose.yaml --profile mysql up -d    + MySQL 8.4(전환 전 코드와 비교·데이터 이관 때만)
#
# 포트는 127.0.0.1 에만 연다. 데이터는 이름 있는 볼륨에 남는다(지우려면 `down -v`).
name: ads-server-db

services:
  postgres:
    image: postgres:18.6-trixie  # failure_test.py 의 IMAGE 와 같게(docs/plans/00 §4.3 V-1)
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER 가 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${DB_NAME:-ads_server}
      # 정렬은 builtin C.UTF-8(결정 D11) — 코드값 순서라 ICU·glibc 버전이 바뀌어도 문자열 색인의 순서가 바뀌지 않는다. 시험 DB 도 template1 에서 물려받는다.
      # --locale 로 libc 쪽(LC_COLLATE·LC_CTYPE·메시지 등)도 C.UTF-8 로 맞춘다 — en_US.utf8 이 없는 OS 로 옮겨도 접속이 막히지 않게(C.UTF-8 은 glibc 에 들어 있다).
      # initdb 때만 적용된다: 바꾸면 `down -v` 로 볼륨을 다시 만든다
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      retries: 30

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER 가 필요합니다}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD 가 필요합니다}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}  # `:?` 는 프로필을 켜지 않아도 기본 up 을 막는다(Compose 는 파일 전체를 먼저 채운다). 비면 mysql 이미지가 초기화에서 멈춘다
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs", "--transaction-isolation=READ-COMMITTED"]
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      retries: 60

volumes:
  postgres:
  mongodb:
  mysql:
