worker_processes 1;
pid "@RUNTIME@/nginx.pid";
error_log stderr;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log "@RUNTIME@/access.log";
    client_body_temp_path "@RUNTIME@/client_temp";
    proxy_temp_path "@RUNTIME@/proxy_temp";
    fastcgi_temp_path "@RUNTIME@/fastcgi_temp";
    uwsgi_temp_path "@RUNTIME@/uwsgi_temp";
    scgi_temp_path "@RUNTIME@/scgi_temp";
    upstream service_http {
        hash $cookie_campus_sessionid consistent;
        server 127.0.0.1:@BACKEND_1@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_2@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_3@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_4@ max_fails=2 fail_timeout=10s;
    }
    upstream service_chat {
        least_conn;
        zone service_chat 64k;
        server 127.0.0.1:@BACKEND_1@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_2@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_3@ max_fails=2 fail_timeout=10s;
        server 127.0.0.1:@BACKEND_4@ max_fails=2 fail_timeout=10s;
    }
    map $http_upgrade $service_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen @BIND@:@NGINX_PORT@;
        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Preserve HTTPS through the frontend's local HTTP connection.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $service_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        location = /healthz {
            access_log off;
            return 200 "service nginx ready\n";
        }
        location /static/ {
            alias "@STATIC@/";
            autoindex off;
            expires 1h;
        }
        location ~ ^/ws/(movement|campus)/$ { return 404; }
        location = /ws/chat/ { proxy_pass http://service_chat; }
        location / { proxy_pass http://service_http; }
    }
}
