# Movement EC2: four local Daphne processes. Allow port 8000 only from the HTTPS ingress.
upstream movement_processes {
    least_conn;
    zone movement_processes 64k;
    server 127.0.0.1:9101 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9102 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9103 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9104 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $movement_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 "movement edge ready\n";
    }

    location = /ws/movement/ {
        proxy_pass http://movement_processes;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $movement_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
    }

    location / {
        return 404;
    }
}
