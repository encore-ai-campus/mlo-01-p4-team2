# Service EC2: HTTP and chat only. Public HTTPS is terminated by the existing ingress.
upstream service_http {
    hash $cookie_campus_sessionid consistent;
    server 127.0.0.1:9201 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9202 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9203 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9204 max_fails=2 fail_timeout=10s;
}

upstream service_chat {
    least_conn;
    zone service_chat 64k;
    server 127.0.0.1:9201 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9202 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9203 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9204 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $service_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8000;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $service_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;

    location = /ws/movement/ {
        return 404;
    }

    location = /ws/campus/ {
        return 404;
    }

    location = /ws/chat/ {
        proxy_pass http://service_chat;
    }

    location / {
        proxy_pass http://service_http;
    }
}
