<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빼빼로 · 동작 미리보기</title>
<style>body{margin:0;background:#f6e9e4;color:#58303c;font:16px system-ui}main{max-width:900px;margin:40px auto;padding:24px}h1{font-size:30px}p{line-height:1.7}canvas{width:100%;background:radial-gradient(ellipse at center,#fff6e0,#e4c4c5);border-radius:28px;box-shadow:0 20px 60px #602f3a20}button,a{display:inline-block;border:0;border-radius:12px;background:#70394c;color:#fff;padding:13px 20px;font:inherit;margin:6px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#c77992}#status{min-height:30px;font-weight:bold}</style>
<main><h1>Sweet Shield · 빼빼로 플레이</h1><p>실제 캐릭터와 게임의 찌르기·방어막 렌더링을 사용한 동작 미리보기입니다.<br>여기서는 애니메이션만 확인합니다. 실제 소모와 리필 판정은 메타버스 서버에서 처리됩니다.</p>
<canvas id="stage" width="900" height="390"></canvas><p id="status"></p>
<button id="poke">찌르기</button><button id="refill">상자에서 리필</button><button id="guard" aria-pressed="true">상대방 막기: 켬</button><a href="/">메타버스 입장</a></main>
<script src="avatars.js?v=idle-20261023"></script><script src="pepero-swing.js?v=durability-10-20261023"></script><script src="poke.js?v=durability-counter-20261023"></script>
<script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),P={inverseVector:(x,y)=>({x,y})};
const a={avatar:'male-1',dir:'right',peperoRemaining:10},b={avatar:'female-1',dir:'left',guarding:true};
const status=document.getElementById('status');let ready=0;
function text(){status.textContent=`남은 빼빼로 ${a.peperoRemaining}/10 · ${b.guarding?'방어에 맞으면 즉시 부서져요.':'적중 2번마다 한 칸씩 줄어요.'}`;}
document.getElementById('guard').onclick=e=>{b.guarding=!b.guarding;e.target.textContent='상대방 막기: '+(b.guarding?'켬':'끔');e.target.setAttribute('aria-pressed',b.guarding);text();};
document.getElementById('refill').onclick=()=>{a.peperoRemaining=10;text();};
document.getElementById('poke').onclick=()=>{const t=performance.now();if(t<ready)return;if(!a.peperoRemaining){status.textContent='다 썼어요. 상자에서 리필해 주세요.';return;}ready=t+250;a._campusPoke={started:t,dir:'right',reach:72};if(b.guarding){a._peperoBreak={started:t,before:a.peperoRemaining,x:20,y:-18};a.peperoRemaining=0;b._campusGuardPulse={started:t};a._campusPokeDeflect={started:t,dir:'right'};}else{a.peperoRemaining--;b._campusPokeReaction={started:t,dir:'right'};}text();};
function draw(t){ctx.clearRect(0,0,900,390);for(const [actor,x,label] of [[a,345,'나'],[b,549,'상대방']]){ctx.save();ctx.translate(x,275);ctx.scale(3,3);ctx.fillStyle='#6c34441c';ctx.beginPath();ctx.ellipse(0,0,15,4,0,0,Math.PI*2);ctx.fill();CampusPoke.react(ctx,actor,t,P);CampusPoke.draw(ctx,actor,t,P,true);CampusAvatars.draw(ctx,CampusPoke.pose(actor,t),t);CampusPoke.guard(ctx,actor,t);CampusPoke.draw(ctx,actor,t,P,false);CampusPoke.contact(ctx,actor,t,P);ctx.restore();ctx.font='600 17px system-ui';ctx.fillStyle='#643647';ctx.textAlign='center';ctx.fillText(label,x,326);}requestAnimationFrame(draw);}text();requestAnimationFrame(draw);
</script></html>
