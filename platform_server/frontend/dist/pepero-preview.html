<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),data=CampusWorlds[new URLSearchParams(location.search).get("floor")==="rooftop"?"rooftop":"campus"],renderer=CampusIsometric.create({data}),P=renderer.projection;
const isPepero=true;document.querySelector('#previewTitle').textContent='Chocolate Atelier';

const camera={x:0,y:0,zoom:1},actor={x:1250,y:480,dir:'down',avatar:CampusAvatars.ids[0],moving:false};let view='all',drag=null,w=innerWidth,h=innerHeight;
const roof=data.id==='rooftop';const floorToggle=document.querySelector('#floorToggle');floorToggle.textContent=roof?'18층 보기':'옥상 보기';document.querySelector('#previewTitle').textContent=roof?'Chocolate Terrace':(isPepero?'Chocolate Atelier':'PLAYDATA Campus');if(roof){document.querySelector('[data-view=atelier]').textContent='초콜릿 광장';document.querySelector('[data-view=lounge]').textContent='기프트 마켓';document.querySelector('[data-view=entrance]').textContent='스위트 부스';}floorToggle.onclick=()=>{const u=new URL(location.href);if(roof)u.searchParams.delete('floor');else u.searchParams.set('floor','rooftop');location.assign(u.href)};
function frame(name){view=name;const targets={atelier:[1248,260,1.18],lounge:[1920,750,1.4],entrance:[1980,990,1.5]};if(name==='all'){const floors=data.surfaces||data.rooms;const pts=floors.flatMap(r=>[[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]].map(([x,y])=>P.project(x,y,r.z||0)));const left=Math.min(...pts.map(q=>q.x))-35,right=Math.max(...pts.map(q=>q.x))+35,top=Math.min(...pts.map(q=>q.y))-(roof?400:140),bottom=Math.max(...pts.map(q=>q.y))+30;camera.zoom=Math.min((w-24)/(right-left),(h-145)/(bottom-top));camera.x=w/2-(left+right)/2*camera.zoom;camera.y=75+(h-145-(bottom-top)*camera.zoom)/2-top*camera.zoom;}else{const [x,y,z]=roof?({atelier:[1680,870,1.15],lounge:[1800,360,1.2],entrance:[580,850,.9]})[name]:targets[name],q=P.project(x,y);camera.zoom=z*Math.min(w/1400,h/850);camera.x=w/2-q.x*camera.zoom;camera.y=h/2-q.y*camera.zoom;}document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name));}
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=w*d;canvas.height=h*d;frame(view)}resize();addEventListener('resize',resize);
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame(b.dataset.view));
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){camera.x=drag.cx+e.clientX-drag.x;camera.y=drag.cy+e.clientY-drag.y}});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();const z=Math.max(.25,Math.min(2.5,camera.zoom*Math.exp(-e.deltaY*.001)));const r=z/camera.zoom;camera.x=e.clientX-(e.clientX-camera.x)*r;camera.y=e.clientY-(e.clientY-camera.y)*r;camera.zoom=z},{passive:false});
function draw(t){const d=canvas.width/w;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle=window.CAMPUS_SEASON==='pepero'?'#35232d':'#f7f1e7';ctx.fillRect(0,0,w,h);ctx.translate(camera.x,camera.y);ctx.scale(camera.zoom,camera.zoom);renderer.draw(ctx,{camera,actors:[actor],t,viewportWidth:w,viewportHeight:h});requestAnimationFrame(draw)}requestAnimationFrame(draw);
window.peperoPreview={renderer,data,camera,frame};
</script></body></html>
