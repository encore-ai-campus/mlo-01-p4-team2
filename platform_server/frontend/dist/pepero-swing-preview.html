<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빼빼로 왕복 휘두르기 · 플레이 시안</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7eee8;color:#613544;font:15px system-ui}main{max-width:1000px;margin:22px auto;padding:22px}small{letter-spacing:2px;color:#9f7363}h1{margin:8px 0;font-size:28px}p{line-height:1.6}canvas{width:100%;border-radius:24px;background:radial-gradient(ellipse at 45% 60%,#fff9e4,#e8cbd1);touch-action:none}button,select{padding:12px 16px;margin:5px 5px 5px 0;border:1px solid #d5aab5;border-radius:12px;background:#fff9ef;color:#633547;font:inherit;cursor:pointer}button.primary{background:#70394c;color:#fff}button:disabled{opacity:.5}#meter{font-size:19px;font-weight:700}#result{min-height:24px}a{color:#804757}details{margin-top:16px}img{width:100%}</style>
<main><small>PEPERO DAY · COMBO STUDY 02</small><h1>휘두르고, 되받아 휘두르고</h1><p><b>Z를 누르고 있거나 ‘연속 휘두르기’를 눌러보세요.</b> 적중 2번마다 짧아지고, 10번 적중하면 소진됩니다. 방어에 맞으면 즉시 부서집니다. <b>E로 리필</b>할 수 있습니다.</p>
<canvas id="stage" width="950" height="380" aria-label="왕복 휘두르기와 빼빼로 상자 시안"></canvas>
<p id="meter" role="status"></p><div id="result" aria-live="polite"></div>
<button id="hold" class="primary">누르고 휘두르기 · Z</button><button id="auto">연속 휘두르기</button><button id="refill">상자에서 리필 · E</button>
<label>상대 상태 <select id="outcome"><option value="hit">적중</option><option value="block">막기</option><option value="miss">빗나감</option></select></label>
<label>속도 <select id="speed"><option value="500">느리게 확인</option><option value="250">실제 속도 · 0.25초/타</option></select></label>
<p>새 8프레임 에셋의 정방향·역방향 동작을 연결하고 손에 빼빼로를 별도로 붙였습니다.<br>이 페이지는 소모·리필을 확인하는 시안입니다. 실제 캠퍼스의 서버 판정과 모션은 이번 시안으로 교체하지 않았습니다.</p>
<details><summary>8프레임 원본 에셋 보기</summary><img src="assets/seasonal/pepero/previews/mint-combo-v2.png" alt="정방향과 역방향 휘두르기 8프레임"></details><a href="/">메타버스로 돌아가기</a></main>
<script src="avatars.js?v=idle-20261023"></script><script src="poke.js"></script><script src="swing-combo.js?v=durability-10-20261023"></script><script>
const c=document.getElementById('stage'),g=c.getContext('2d'),combo=new SwingCombo(),sheet=new Image();sheet.src='assets/seasonal/pepero/previews/mint-combo-v2.png';
const roots=[207,580,940,1348,214,584,950,1355],feet=[490,490,490,490,930,930,930,930],hands=[[100,240],[597,339],[1088,363],[1266,376],[110,780],[710,715],[1085,671],[1240,674]],angles=[-2.15,-.8,.1,.8,.8,-.2,-1.1,-2.15];
const target={avatar:'female-1',dir:'left'},hold=document.getElementById('hold'),auto=document.getElementById('auto'),meter=document.getElementById('meter'),result=document.getElementById('result');let automatic=false,last=performance.now(),hitAt=-1000,lastText='',lastStroke=-1,oldResolved=false;
function stop(){automatic=false;combo.stop();auto.textContent='연속 휘두르기';}function refill(){stop();combo.refill();}document.getElementById('refill').onclick=refill;
auto.onclick=()=>{automatic=!automatic;if(automatic)combo.start();else combo.stop();auto.textContent=automatic?'연속 동작 멈추기':'연속 휘두르기';};
hold.onpointerdown=e=>{hold.setPointerCapture(e.pointerId);combo.start();};for(const name of ['pointerup','pointercancel','lostpointercapture'])hold.addEventListener(name,()=>{if(!automatic)combo.stop();});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='KeyZ'){e.preventDefault();combo.start();}if(e.code==='KeyE'&&!e.repeat){e.preventDefault();refill();}});document.addEventListener('keyup',e=>{if(e.code==='KeyZ'&&!automatic)combo.stop();});window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
document.getElementById('speed').onchange=e=>{stop();combo.duration=Number(e.target.value);};
c.onclick=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*950/r.width,y=(e.clientY-r.top)*380/r.height;if(x>680&&y>160)refill();};
function body(f,alpha){if(!sheet.complete||!sheet.naturalWidth)return;const col=f%4,row=Math.floor(f/4);g.globalAlpha=alpha;g.drawImage(sheet,col*384,row*512,384,512,300+(col*384-roots[f])*.5,315+(row*512-feet[f])*.5,192,256);g.globalAlpha=1;}
function render(t){const dt=Math.max(0,t-last);last=t;const outcome=document.getElementById('outcome').value;combo.advance(dt,outcome);
if(combo.resolved&&!oldResolved){hitAt=t;if(outcome==='block')target._campusGuardPulse={started:t};}oldResolved=combo.resolved;
g.clearRect(0,0,950,380);g.fillStyle='#75475519';for(const x of [300,505,770]){g.beginPath();g.ellipse(x,318,x===770?65:50,10,0,0,Math.PI*2);g.fill();}
const f=combo.frame,next=(f+1)%8,blend=combo.active?Math.max(0,(combo.phase*4%1-.65)/.35):0,u=blend*blend*(3-2*blend);body(f,1-u);if(u>0)body(next,u);
const h0=[hands[f][0]-roots[f],hands[f][1]-feet[f]],h1=[hands[next][0]-roots[next],hands[next][1]-feet[next]],hx=300+(h0[0]+(h1[0]-h0[0])*u)*.5,hy=315+(h0[1]+(h1[1]-h0[1])*u)*.5,angle=angles[f]+(angles[next]-angles[f])*u;
if(combo.remaining>0){g.save();g.translate(hx,hy);g.rotate(angle);const length=17+Math.ceil(combo.remaining/2)*10;g.lineCap='round';g.strokeStyle='#d8ad69';g.lineWidth=6;g.beginPath();g.moveTo(0,0);g.lineTo(length,0);g.stroke();g.strokeStyle='#603329';g.lineWidth=8;g.beginPath();g.moveTo(12,0);g.lineTo(length,0);g.stroke();for(let j=17;j<length;j+=9){g.fillStyle='#ffbed2';g.fillRect(j,-2,3,2);}g.restore();}
if(combo.active&&!matchMedia('(prefers-reduced-motion: reduce)').matches){g.save();g.strokeStyle='#e78ca655';g.lineWidth=4;g.beginPath();const a=combo.stroke%2?1.2:-1.2;g.ellipse(330,211,106,74,0,a,a+(combo.stroke%2?-1:1)*combo.phase*2);g.stroke();g.restore();}
target.guarding=outcome==='block';g.save();g.translate(outcome==='miss'?580:505,315);g.scale(4.2,4.2);CampusAvatars.draw(g,target,t);CampusPoke.guard(g,target,t);g.restore();
g.save();g.translate(720,245);g.fillStyle='#68372e';g.strokeStyle='#e9c08d';g.lineWidth=3;g.fillRect(0,0,100,69);g.strokeRect(0,0,100,69);for(let i=0;i<6;i++){g.strokeStyle=i%2?'#eb9eb2':'#542b25';g.lineWidth=9;g.beginPath();g.moveTo(12+i*15,8);g.lineTo(8+i*16,-53-(i%2)*12);g.stroke();}g.fillStyle='#fff0cd';g.font='bold 15px Georgia';g.textAlign='center';g.fillText('PEPERO',50,36);g.fillText('E · REFILL',50,57);g.restore();
g.fillStyle='#6f4050';g.font='600 15px system-ui';g.textAlign='center';g.fillText(combo.active?(combo.stroke%2?'역방향 스윙':'정방향 스윙'):'나',300,354);g.fillText('상대방',505,354);g.fillText('클릭 / E · 리필',770,354);
const label=`빼빼로 ${combo.remaining}/10`;if(label!==lastText){meter.textContent=label;lastText=label;}result.textContent=combo.lastResult==='block'?'막혔어요 · 빼빼로가 부서졌어요.':!combo.remaining?'다 썼어요! 상자에서 리필해 주세요.':combo.lastResult==='miss'?'빗나갔어요 · 소모 없음':combo.lastResult==='hit'?'적중 · 2번마다 빼빼로가 한 칸 짧아져요.':'빼빼로를 들고 있어요.';hold.disabled=auto.disabled=!combo.remaining;if(!combo.active&&automatic){automatic=false;auto.textContent='연속 휘두르기';}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
