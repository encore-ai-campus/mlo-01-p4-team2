daemon off;
worker_processes 1;
pid /private/tmp/platform-final-integration-20261107/assets-runtime/nginx.pid;
error_log /private/tmp/platform-final-integration-20261107/assets-runtime/error.log warn;
events { worker_connections 8192; }
http {
    include /opt/homebrew/etc/nginx/mime.types;
    access_log /private/tmp/platform-final-integration-20261107/assets-runtime/access.log;
    server {
        listen 127.0.0.1:59507;
        location = /healthz { return 200 "ready"; }
        location /static/campus/ { alias /private/tmp/platform-final-integration-20261107/source/frontend/dist/; }
        location / { return 404; }
    }
}
