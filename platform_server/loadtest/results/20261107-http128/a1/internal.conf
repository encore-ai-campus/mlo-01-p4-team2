pid /private/tmp/platform-http128-20261107/a1/internal.pid;
error_log /private/tmp/platform-http128-20261107/a1/internal-error.log;
worker_processes 1;
events { worker_connections 8192; }
http {
log_format measurements '$msec|$server_port|$status|$upstream_addr|$request_time|$upstream_response_time|$uri';
access_log /private/tmp/platform-http128-20261107/a1/nginx-logs/native-access.log measurements;
proxy_http_version 1.1;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
proxy_set_header Host $http_host;
proxy_set_header Cookie $http_cookie;
proxy_set_header Origin $http_origin;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 3600s;
client_max_body_size 1m;
upstream movement_workers { least_conn; server 127.0.0.1:9551;server 127.0.0.1:9552;server 127.0.0.1:9553;server 127.0.0.1:9554;}
upstream service_workers { hash $cookie_campus_sessionid consistent; server 127.0.0.1:9561;server 127.0.0.1:9562;server 127.0.0.1:9563;server 127.0.0.1:9564;}
server { listen 127.0.0.1:8097; location = /ws/movement/ { proxy_pass http://movement_workers; } location / { return 404; }}
server { listen 127.0.0.1:8098; location = /ws/movement/ { return 404; } location = /ws/campus/ { return 404; } location / { proxy_pass http://service_workers; }}
}